[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evodev"
version = "0.1.0"
description = "An evaluation-driven self-evolving ReAct coding agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=2.1,<3",
    "openai>=1.50,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
evodev-smoke-llm = "evodev.smoke_llm:main"
evodev-baseline = "evodev.evaluation.baseline:main"
evodev-reflect = "evodev.experience.generate:main"
evodev-experience-experiment = "evodev.evaluation.experience_experiment:main"
evodev-prepare-validation-baseline = "evodev.evaluation.experience_experiment:prepare_main"
evodev-evolve = "evodev.evolution.cli:main"
evodev-final = "evodev.evaluation.final_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
